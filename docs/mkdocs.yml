# cl-history-kit documentation — MkDocs + Material configuration.
#
# Build:   mkdocs build -f docs/mkdocs.yml --strict
# Serve:   mkdocs serve  -f docs/mkdocs.yml
# The Nix flake (`nix build .#docs`) drives the same config offline.

site_name: cl-history-kit
site_description: >-
  Dependency-free command-history store, search, and recall navigation for
  Common Lisp — bounded storage, duplicate policies, smartcase search, and a
  prefix-filtered recall cursor that preserves the in-progress input.
site_author: cl-history-kit contributors
site_url: https://nerima-lisp.github.io/cl-history-kit/

repo_name: nerima-lisp/cl-history-kit
repo_url: https://github.com/nerima-lisp/cl-history-kit
edit_uri: edit/main/docs/src/

# Content lives in docs/src; the rendered site is written to docs/../site.
docs_dir: src
site_dir: ../site
use_directory_urls: true

copyright: Copyright &copy; cl-history-kit contributors — MIT License

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
    logo: material/history
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nerima-lisp/cl-history-kit
      name: cl-history-kit on GitHub
  generator: false

plugins:
  - search

markdown_extensions:
  # Callouts / admonitions.
  - admonition
  - pymdownx.details
  # Code blocks: syntax highlighting, line numbers, inline highlighting.
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  # pymdownx.snippets is deliberately absent: its only use here was pulling the
  # root CHANGELOG.md into docs/src/changelog.md, and neither file exists any
  # more (2026-08-01 -- the GitHub Release description is the only changelog).
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # Content tabs (e.g. Nix vs. ASDF install paths).
  - pymdownx.tabbed:
      alternate_style: true
  # Task lists, key bindings, smart symbols, emoji.
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      title: On this page

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Guide:
      - Entries and the Store: guide/store.md
      - Search: guide/search.md
      - Recall Navigation: guide/navigation.md
  - Reference:
      - API: reference/api.md
      - Conditions: reference/conditions.md
  - Project:
      - Development: project/development.md
      - Scope and Non-Goals: project/scope.md
