name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs for the same PR; never cancel a push to main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # One job per system the flake declares in `systems`. `nix flake check`
    # skips systems the runner cannot build, so each runner checks exactly its
    # own: ubuntu-latest covers x86_64-linux and macos-latest (arm64) covers
    # aarch64-darwin. Keep this matrix and that list in step -- the flake's
    # rule is that it never advertises a platform CI does not verify.
    name: check (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: macos-latest
            system: aarch64-darwin
    timeout-minutes: 20
    steps:
      # persist-credentials: false — this job runs untrusted PR code via
      # `nix flake check`, and never needs the token, so don't leave it in
      # .git/config for that code to read.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # `nix flake check` runs the SBCL test suite *and* the treefmt
      # formatting gate (checks.formatting), so unformatted Nix fails CI here.
      - name: Check flake
        run: nix flake check --print-build-logs
