name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs for the same PR; never cancel a push to the default
# branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One job on purpose. Granularity belongs in the flake's `checks.*`
  # attributes, which `nix flake check` evaluates in parallel with build
  # caching. Splitting these into separate GitHub jobs would duplicate that
  # scheduling and lose cache sharing between them.
  #
  # Add a second job ONLY for work the Nix sandbox cannot do: network access,
  # a real PTY/TTY, or artifact upload.
  #
  # There used to be a two-entry matrix here (ubuntu-latest/x86_64-linux and
  # macos-latest/aarch64-darwin), because the flake declared both systems and
  # the org rule is that it never advertises a platform CI does not verify.
  # The 2026-08-01 revision made the org Linux-only, so the flake now declares
  # x86_64-linux alone and the matrix collapsed to a single entry. A one-entry
  # matrix signals "more platforms are coming"; that signal is retired, so
  # `runs-on` is spelled out directly. `--all-systems` is deliberately NOT
  # passed: with one declared system it changes nothing.
  check:
    name: nix flake check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # persist-credentials: false — this job runs untrusted PR code via
      # `nix flake check`, and never needs the token, so don't leave it in
      # .git/config for that code to read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Runs the SBCL test suite (checks.default), the treefmt formatting gate
      # (checks.formatting), and the mkdocs --strict build (checks.docs).
      - name: Check flake
        run: nix flake check --print-build-logs

      # Catches stray conflict markers and whitespace errors that compile fine.
      - name: Check diff hygiene
        run: git diff --check
